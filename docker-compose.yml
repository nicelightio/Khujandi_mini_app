services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      NODE_ENV: ${NODE_ENV:-production}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-}
      ADMIN_ALLOWED_ORIGINS: ${ADMIN_ALLOWED_ORIGINS:-https://tgmeal.natureonzoom.win}
      DATABASE_URL: ${DATABASE_URL:-postgresql://tgmeal:CHANGE_ME@host.docker.internal:5432/tgmeal?schema=public}
      ADMIN_DB_PATH: ${ADMIN_DB_PATH:-/var/lib/khujandi/admin-access-runtime.sqlite}
      CATALOG_DB_PATH: ${CATALOG_DB_PATH:-/var/lib/khujandi/catalog-runtime.sqlite}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-test-bot-token}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - catalog_runtime_data:/var/lib/khujandi
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/shops"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        DEBUG: ${DEBUG:-FALSE}
    depends_on:
      api:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.docker.network: web
      traefik.http.routers.tgmeal-http.rule: Host(`${TGMEAL_HOST:-tgmeal.natureonzoom.win}`)
      traefik.http.routers.tgmeal-http.entrypoints: web
      traefik.http.routers.tgmeal-http.middlewares: tgmeal-https-redirect
      traefik.http.middlewares.tgmeal-https-redirect.redirectscheme.scheme: https
      traefik.http.routers.tgmeal.rule: Host(`${TGMEAL_HOST:-tgmeal.natureonzoom.win}`)
      traefik.http.routers.tgmeal.entrypoints: websecure
      traefik.http.routers.tgmeal.tls: "true"
      traefik.http.services.tgmeal.loadbalancer.server.port: "80"
    networks:
      - default
      - web
    restart: unless-stopped

volumes:
  catalog_runtime_data:

networks:
  web:
    external: true
