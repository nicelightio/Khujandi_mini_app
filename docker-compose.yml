services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      NODE_ENV: ${NODE_ENV:-production}
      APP_ENV: ${APP_ENV:-production}
      DEBUG: ${DEBUG:-FALSE}
      E2E_TEST_MODE: ${E2E_TEST_MODE:-FALSE}
      E2E_TEST_TOKEN: ${E2E_TEST_TOKEN:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-}
      ADMIN_ALLOWED_ORIGINS: ${ADMIN_ALLOWED_ORIGINS:-https://tgmeal.natureonzoom.win}
      DATABASE_URL: ${DATABASE_URL:-postgresql://tgmeal:CHANGE_ME@host.docker.internal:5432/tgmeal?schema=public}
      ADMIN_DB_PATH: ${ADMIN_DB_PATH:-/var/lib/khujandi/admin-access-runtime.sqlite}
      CATALOG_DB_PATH: ${CATALOG_DB_PATH:-/var/lib/khujandi/catalog-runtime.sqlite}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-test-bot-token}
      TELEGRAM_BOT_POLLING: ${TELEGRAM_BOT_POLLING:-FALSE}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - catalog_runtime_data:${TGMEAL_RUNTIME_DIR:-/var/lib/khujandi}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/shops"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        DEBUG: ${DEBUG:-FALSE}
    depends_on:
      api:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.${TRAEFIK_ROUTER_PREFIX:-tgmeal}-http.rule=Host(`${TGMEAL_HOST:-tgmeal.natureonzoom.win}`)
      - traefik.http.routers.${TRAEFIK_ROUTER_PREFIX:-tgmeal}-http.entrypoints=web
      - traefik.http.routers.${TRAEFIK_ROUTER_PREFIX:-tgmeal}-http.middlewares=${TRAEFIK_ROUTER_PREFIX:-tgmeal}-https-redirect
      - traefik.http.middlewares.${TRAEFIK_ROUTER_PREFIX:-tgmeal}-https-redirect.redirectscheme.scheme=https
      - traefik.http.routers.${TRAEFIK_ROUTER_PREFIX:-tgmeal}.rule=Host(`${TGMEAL_HOST:-tgmeal.natureonzoom.win}`)
      - traefik.http.routers.${TRAEFIK_ROUTER_PREFIX:-tgmeal}.entrypoints=websecure
      - traefik.http.routers.${TRAEFIK_ROUTER_PREFIX:-tgmeal}.tls=true
      - traefik.http.services.${TRAEFIK_ROUTER_PREFIX:-tgmeal}.loadbalancer.server.port=80
    networks:
      - default
      - web
    restart: unless-stopped

volumes:
  catalog_runtime_data:
    name: ${TGMEAL_RUNTIME_VOLUME:-tgmeal_catalog_runtime_data}

networks:
  web:
    external: true
